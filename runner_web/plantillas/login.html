<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro de Pruebas QA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--fondo:#eef3f2;--sup:#ffffff;--tinta:#142225;--suave:#5a6d70;--linea:#d6e1df;--acento:#0e7c7b;--acento-t:#ffffff;--fail:#c0362c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fondo:#0d1416;--sup:#142023;--tinta:#e1ebe9;--suave:#93a8a6;--linea:#233437;--acento:#3fc1b8;--acento-t:#0d1416;--fail:#ff8a7e}}
:root[data-theme="dark"]{--fondo:#0d1416;--sup:#142023;--tinta:#e1ebe9;--suave:#93a8a6;--linea:#233437;--acento:#3fc1b8;--acento-t:#0d1416;--fail:#ff8a7e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--fondo);color:var(--tinta);
  font:15px/1.5 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;padding:16px}
.caja{width:100%;max-width:400px;background:var(--sup);border:1px solid var(--linea);border-radius:14px;padding:32px 28px}
.marca{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--acento);color:var(--acento-t);display:grid;place-items:center}
h1{font-size:1.25rem;margin:0;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--suave);font-size:.85rem}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-size:.85rem;color:var(--suave);font-weight:500}
input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--linea);background:var(--fondo);color:var(--tinta)}
input:focus-visible,button:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
button{font:inherit;font-weight:600;padding:11px;border-radius:8px;border:0;background:var(--acento);color:var(--acento-t);cursor:pointer;margin-top:6px}
button:disabled{opacity:.6;cursor:wait}
.error{color:var(--fail);font-size:.88rem;min-height:1.3em;margin:0}
.pie{margin:20px 0 0;color:var(--suave);font-size:.78rem}
</style>
</head>
<body>
<main class="caja">
  <div class="marca">
    <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/><path d="M7.5 15h9"/></svg></div>
    <div><h1>Centro de Pruebas QA</h1><p class="sub">Automatización de Fetal Medical Bolivia</p></div>
  </div>
  <form id="f">
    <label>Usuario<input name="usuario" autocomplete="username" required autofocus></label>
    <label>Contraseña<input name="clave" type="password" autocomplete="current-password" required></label>
    <p class="error" id="e" role="alert">{{ error }}</p>
    <button id="b" type="submit">Ingresar</button>
  </form>
  <p class="pie">Selenium WebDriver · Selenium IDE · pytest · Locust. Solo datos sintéticos QA.</p>
</main>
<script>
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  const d = Object.fromEntries(new FormData(ev.target));
  b.disabled = true; b.textContent = 'Ingresando…'; e.textContent = '';
  try {
    const r = await fetch('/api/ingresar', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(d)});
    if (r.ok) { location.href = '/'; return; }
    const j = await r.json().catch(() => ({}));
    e.textContent = j.detail || 'No se pudo ingresar';
  } catch { e.textContent = 'Sin conexión con el panel'; }
  b.disabled = false; b.textContent = 'Ingresar';
});
</script>
</body>
</html>
